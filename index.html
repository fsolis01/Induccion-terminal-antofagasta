<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Antofagasta — Inducción de Seguridad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#3B3B42;
    --navy-deep:#242428;
    --cyan:#0A84C0;
    --cyan-dim:#D9EDF7;
    --red:#C23D47;
    --amber:#EE9F2E;
    --danger:#C23D47;
    --paper:#FFFFFF;
    --card:#FFFFFF;
    --ink:#2E2E33;
    --ink-soft:#75757B;
    --line:#E7E7EA;
    --ok:#1E8E5A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding-bottom:64px;}

  /* HERO */
  .hero{
    background:#FFFFFF;
    color:var(--ink);
    padding:5px 22px 34px;
    position:relative;
    overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .hero::before{
    content:"";
    display:block;
    height:5px;
    margin:0 -22px 26px;
    background:linear-gradient(90deg,var(--red) 0%,var(--cyan) 100%);
  }
  .brand-row{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand img{height:34px;width:34px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));}
  .brand .word{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;letter-spacing:.5px;line-height:1.15;color:var(--navy);}
  .brand .word small{display:block;font-family:'Inter';font-weight:600;font-size:9px;letter-spacing:1.3px;color:var(--ink-soft);text-transform:uppercase;}
  .tag{font-size:11px;font-weight:600;color:var(--cyan);background:var(--cyan-dim);padding:4px 10px;border-radius:100px;}
  .hero h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    font-size:38px;
    line-height:1.02;
    margin:26px 0 4px;
    position:relative;z-index:1;
    color:var(--navy);
  }
  .hero h1 em{font-style:normal;color:var(--red);}
  .hero .en{font-size:14px;color:var(--cyan);font-weight:500;margin:0 0 18px;position:relative;z-index:1;}
  .hero p.lead{font-size:14.5px;color:var(--ink-soft);max-width:46ch;position:relative;z-index:1;margin:0;}
  .addr{
    margin-top:22px;font-size:12.5px;color:var(--ink-soft);
    border-top:1px solid var(--line);padding-top:14px;position:relative;z-index:1;
  }

  section{padding:30px 22px 6px;}
  .eyebrow{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:21px;color:var(--navy);margin:0 0 2px;}
  .eyebrow .en{display:block;font-family:'Inter';font-weight:500;font-size:12.5px;color:var(--cyan);text-transform:none;margin-bottom:14px;}

  /* GOLDEN RULES */
  .rules{list-style:none;margin:0;padding:0;display:grid;gap:10px;}
  .rules li{
    display:flex;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px 14px;align-items:flex-start;
  }
  .rules .n{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    background:var(--red);color:#fff;font-family:'Barlow Condensed';font-weight:700;
    display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:1px;
  }
  .rules .t{font-size:14px;}
  .rules .t .en{display:block;color:var(--cyan);font-size:12.5px;margin-top:2px;}

  /* ICON GRID (obligations / prohibitions) */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .icard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;display:flex;flex-direction:column;gap:6px;
  }
  .icard .ico{width:40px;height:40px;flex:0 0 auto;}
  .icard .ico svg{width:100%;height:100%;display:block;}
  .icard.mando{border-color:#BEE0F0;background:#F2FAFD;}
  .icard .t{font-size:13px;font-weight:600;}
  .icard .en{display:block;font-size:11.5px;color:var(--cyan);font-weight:500;margin-top:3px;}
  .icard.warn{border-color:#F3D9B0;background:#FFF8EE;}
  .icard.stop{border-color:#F1C3B8;background:#FFF3F0;}

  /* HAZARDS */
  .hazards{display:grid;gap:8px;}
  .hz{
    display:flex;gap:10px;align-items:flex-start;background:var(--card);
    border:1px solid var(--line);border-left:4px solid var(--amber);
    border-radius:10px;padding:10px 12px;
  }
  .hz .ico{width:34px;height:34px;flex:0 0 auto;}
  .hz .ico svg{width:100%;height:100%;display:block;}
  .hz .t{font-size:13.5px;}
  .hz .en{display:block;color:var(--cyan);font-size:12px;}

  .divider{height:1px;background:var(--line);margin:26px 22px;}

  /* map */
  .mapimg{width:100%;border-radius:12px;border:1px solid var(--line);display:block;}
  .mapcap{font-size:11.5px;color:var(--ink-soft);margin-top:8px;text-align:center;}

  /* EPP by role */
  .rolehead{display:flex;align-items:center;gap:10px;margin:20px 0 10px;}
  .rolehead:first-of-type{margin-top:6px;}
  .rolehead .badge{width:32px;height:32px;flex:0 0 auto;}
  .rolehead .badge svg{width:100%;height:100%;display:block;}
  .rolehead .t{font-size:14px;font-weight:700;color:var(--navy);}
  .rolehead .t .en{display:block;font-weight:500;font-size:11.5px;color:var(--cyan);}
  .epprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .epprow .chip{width:42px;height:42px;flex:0 0 auto;}
  .epprow .chip svg{width:100%;height:100%;display:block;}

  /* instruction rows (manejo, estacionamiento, carga/descarga, ambiente) */
  .instr{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px;}
  .instr .ico{width:34px;height:34px;flex:0 0 auto;}
  .instr .ico svg{width:100%;height:100%;display:block;}
  .instr .t{font-size:13.5px;}
  .instr .t .en{display:block;color:var(--cyan);font-size:12px;}


  /* FORM */
  .formcard{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:22px;margin:0 22px 8px;
  }
  .formcard h2{font-family:'Barlow Condensed';font-size:23px;margin:0 0 2px;color:var(--navy);}
  .formcard .sub{font-size:13px;color:var(--ink-soft);margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:5px;}
  .field label .en{display:block;font-weight:500;color:var(--cyan);font-size:11px;margin-top:1px;}
  .field input, .field select{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:15px;font-family:'Inter';background:#FCFDFE;color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--cyan);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .consent-box{
    background:var(--paper);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin:18px 0;display:flex;gap:10px;align-items:flex-start;
    cursor:pointer;
  }
  .consent-box input{width:18px;height:18px;margin-top:2px;flex:0 0 auto;accent-color:var(--cyan);}
  .consent-box .t{font-size:13px;color:var(--ink);}
  .consent-box .t .en{display:block;color:var(--cyan);font-size:11.5px;margin-top:3px;}

  .btn{
    width:100%;padding:14px;border:none;border-radius:12px;
    background:var(--cyan);color:#fff;font-size:15.5px;font-weight:700;
    font-family:'Inter';cursor:pointer;transition:transform .08s ease, opacity .15s ease;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn:not(:disabled):active{transform:scale(.98);}
  .err{color:var(--danger);font-size:12.5px;margin-top:8px;min-height:14px;}

  /* CONFIRMATION */
  .confirm{
    text-align:center;padding:60px 26px;
  }
  .confirm .check{
    width:64px;height:64px;border-radius:50%;background:var(--ok);
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
  }
  .confirm .check svg{width:30px;height:30px;}
  .confirm h2{font-family:'Barlow Condensed';font-size:26px;color:var(--navy);margin:0 0 6px;}
  .confirm p{color:var(--ink-soft);font-size:14px;max-width:38ch;margin:0 auto;}
  .confirm .en{color:var(--cyan);font-size:13px;margin-top:6px;}
  .confirm .id{margin-top:22px;font-size:11.5px;color:#9AA9B5;font-family:monospace;}

  footer{
    text-align:center;font-size:11px;color:#9A8FA3;padding:26px 22px 10px;
  }
  footer img{height:22px;width:22px;object-fit:contain;vertical-align:middle;margin-right:6px;opacity:.85;}

  /* ADMIN */
  .admin-wrap{max-width:920px;margin:0 auto;padding:26px 18px 60px;}
  .admin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .admin-head .title-row{display:flex;align-items:center;gap:10px;}
  .admin-head img{height:32px;width:32px;object-fit:contain;}
  .admin-head h1{font-family:'Barlow Condensed';color:var(--navy);font-size:24px;margin:0;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:13px;}
  th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;}
  th{background:var(--navy);color:#fff;font-weight:600;font-size:12px;}
  tr:last-child td{border-bottom:none;}
  .expbtn{background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;}
  .empty{padding:40px;text-align:center;color:var(--ink-soft);font-size:14px;}
</style>
</head>

<script>
const RECORD_PREFIX = 'consent:';

// ---- Google Form connection (data lands in the linked Google Sheet) ----
const GOOGLE_FORM_ACTION = 'https://docs.google.com/forms/d/e/1FAIpQLSdgC_0POvTpD21TheIZY0EYoGO07PoMRGD_vDwpROEYyeJsFg/formResponse';
const GOOGLE_FORM_ENTRIES = {
  nombre: 'entry.350259980',
  rut: 'entry.1177828428',
  tipo: 'entry.895623333',
  empresa: 'entry.1352451026',
  consentimiento: 'entry.447111561'
};
const GOOGLE_FORM_TIPO_LABELS = {
  Transportista: 'Transportista / Carrier',
  Visita: 'Visita / Visitor',
  Contratista: 'Contratista / Contractor'
};
const GOOGLE_FORM_CONSENT_TEXT = "Declaro que he leído y comprendido las normas de seguridad del Terminal Antofagasta / D&C Logística, y me comprometo a cumplirlas. / I declare that I have read and understood the safety rules of Terminal Antofagasta / D&C Logística, and I commit to complying with them.";

// Real hidden-form submission into an invisible iframe: this mimics an
// actual person submitting the Google Form, which Google accepts far more
// reliably than a background fetch() request.
function submitToGoogleForm(record){
  return new Promise((resolve)=>{
    let iframe = document.getElementById('gform-hidden-target');
    if(!iframe){
      iframe = document.createElement('iframe');
      iframe.name = 'gform-hidden-target';
      iframe.id = 'gform-hidden-target';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
    }

    const values = {
      [GOOGLE_FORM_ENTRIES.nombre]: record.nombre,
      [GOOGLE_FORM_ENTRIES.rut]: record.rut,
      [GOOGLE_FORM_ENTRIES.tipo]: GOOGLE_FORM_TIPO_LABELS[record.tipo] || record.tipo,
      [GOOGLE_FORM_ENTRIES.empresa]: record.empresa,
      [GOOGLE_FORM_ENTRIES.consentimiento]: GOOGLE_FORM_CONSENT_TEXT
    };

    const form = document.createElement('form');
    form.action = GOOGLE_FORM_ACTION;
    form.method = 'POST';
    form.target = 'gform-hidden-target';
    form.style.display = 'none';

    Object.keys(values).forEach(name=>{
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = name;
      input.value = values[name];
      form.appendChild(input);
    });

    document.body.appendChild(form);

    let done = false;
    const finish = ()=>{
      if(done) return;
      done = true;
      form.remove();
      resolve();
    };
    iframe.addEventListener('load', finish, { once: true });
    // Fallback in case the load event doesn't fire in time.
    setTimeout(finish, 2500);

    form.submit();
  });
}

// ---- Icon system: mandatory (blue), prohibited (red ring), hazard (amber triangle) ----
function mandatoryIcon(inner){
  return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#0A84C0"/>${inner}</svg>`;
}
function prohibitedIcon(inner){
  return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#fff" stroke="#C23D47" stroke-width="3.2"/>${inner}<line x1="8" y1="32" x2="32" y2="8" stroke="#C23D47" stroke-width="3.2" stroke-linecap="round"/></svg>`;
}
function hazardIcon(inner){
  return `<svg viewBox="0 0 40 40"><path d="M20 3 L37 34 L3 34 Z" fill="#0A84C0" stroke="#C23D47" stroke-width="2.4" stroke-linejoin="round"/>${inner}</svg>`;
}
function instructionIcon(inner){
  return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#242428"/>${inner}</svg>`;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('es-CL');
}

    <div class="divider"></div>

    <section>
      <p class="eyebrow">A qué estás expuesto<span class="en">What you're exposed to on site</span></p>
      <div class="hazards">
        ${[
          [ICONS.hzVehicle,'Impacto de vehículo','Vehicle impact'],
          [ICONS.hzRollover,'Choque, colisión o volcamiento de equipos móviles','Crash, collision or overturning of mobile equipment'],
          [ICONS.hzContainers,'Aplastamiento por maniobras de contenedores','Crushing by container maneuvers'],
          [ICONS.hzLoading,'Aplastamiento por maniobras de carga','Crushing due to loading maneuvers'],
          [ICONS.hzEnergy,'Liberación de energía','Energy release'],
          [ICONS.hzLifting,'Maniobras de levante','Lifting maneuvers'],
          [ICONS.hzFall,'Caída en trabajos de altura','Fall while working at height'],
          [ICONS.hzRoad,'Accidente en ruta','Accident on the road'],
        ].map(h=>`<div class="hz"><span class="ico">${h[0]}</span><span class="t">${h[1]}<span class="en">${h[2]}</span></span></div>`).join('')}
      </div>
    </section>

    <div class="divider"></div>

    <div class="formcard">
      <h2>Registro de ingreso</h2>
      <p class="sub">Entry registration — completa tus datos para continuar</p>

      <div class="field">
        <label>Nombre completo <span class="en">Full name</span></label>
        <input type="text" id="f-nombre" placeholder="Ej: Juan Pérez">
      </div>
      <div class="row2">
        <div class="field">
          <label>RUT</label>
          <input type="text" id="f-rut" placeholder="123456789" inputmode="text" maxlength="9">
        </div>
        <div class="field">
          <label>Tipo <span class="en">Role</span></label>
          <select id="f-tipo">
            <option value="Transportista">Transportista / Carrier</option>
            <option value="Visita">Visita / Visitor</option>
            <option value="Contratista">Contratista / Contractor</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Empresa <span class="en">Company</span></label>
        <input type="text" id="f-empresa" placeholder="Nombre de la empresa">
      </div>

      <div class="consent-box" id="consent-box">
        <input type="checkbox" id="f-consent">
        <div class="t">
          Declaro que leí y entendí las reglas, obligaciones, prohibiciones y riesgos de Terminal Antofagasta, y me comprometo a respetarlos.
          <span class="en">I declare that I have read and understood the rules, obligations, prohibitions and hazards of Terminal Antofagasta, and I commit to respecting them.</span>
        </div>
      </div>

      <button class="btn" id="submit-btn" disabled>Firmar y confirmar ingreso · Sign & confirm entry</button>
      <div class="err" id="form-err"></div>
    </div>

    <footer><img src="${LOGO}" alt="D&C">D&C Logística · HSEQ · Terminal Antofagasta<br>Tus datos se usan solo para control de acceso y auditorías de tri norma.<br><span style="opacity:.7;">Iconografía: Font Awesome Free (CC BY 4.0) y Google Material Symbols (Apache 2.0)</span></footer>
  </div>
  `;

  const nombre = document.getElementById('f-nombre');
  const rut = document.getElementById('f-rut');
  const tipo = document.getElementById('f-tipo');
  const empresa = document.getElementById('f-empresa');
  const consent = document.getElementById('f-consent');
  const box = document.getElementById('consent-box');
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('form-err');

  box.addEventListener('click', (e)=>{
    if(e.target !== consent) consent.checked = !consent.checked;
    btn.disabled = !consent.checked;
  });

  btn.addEventListener('click', async ()=>{
    err.textContent = '';
    if(!nombre.value.trim() || !rut.value.trim()){
      err.textContent = 'Completa nombre y RUT antes de continuar. / Please fill in name and RUT.';
      return;
    }
    if(!/^[0-9]{7,8}[0-9kK]$/.test(rut.value.trim())){
      err.textContent = 'Ingresa el RUT sin puntos ni guion, ej: 123456789. / Enter the RUT with no dots or hyphen, e.g. 123456789.';
      return;
    }
    if(!consent.checked){
      err.textContent = 'Debes aceptar las condiciones. / You must accept the terms.';
      return;
    }
    const record = {
      nombre: nombre.value.trim(),
      rut: rut.value.trim(),
      tipo: tipo.value,
      empresa: empresa.value.trim(),
      fecha: todayStr(),
      timestamp: new Date().toISOString()
    };
    const key = RECORD_PREFIX + Date.now() + '-' + Math.random().toString(36).slice(2,8);

    btn.disabled = true;
    btn.textContent = 'Guardando… / Saving…';

    try{
      await submitToGoogleForm(record);
      renderConfirm(record, key);
    }catch(e){
      err.textContent = 'Error al guardar. Intenta de nuevo. / Error saving. Please retry.';
      btn.disabled = false;
      btn.textContent = 'Firmar y confirmar ingreso · Sign & confirm entry';
    }
  });
}

function renderConfirm(record, key){
  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="wrap">
    <div class="confirm">
      <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
      <h2>Ingreso registrado</h2>
      <p>Gracias, ${esc(record.nombre)}. Tu registro de inducción de seguridad quedó guardado. Ya puedes ingresar a Terminal Antofagasta.</p>
      <p class="en">Thanks, your safety induction record has been saved. You may now enter Terminal Antofagasta.</p>
      <div class="id">${esc(key)}</div>
    </div>
    <footer><img src="${LOGO}" alt="D&C">D&C Logística · HSEQ · Terminal Antofagasta</footer>
  </div>
  `;
}

// ---------- ADMIN VIEW ----------
// Los registros ya no se guardan aquí: viajan directo a un Google Form
// y quedan en su Google Sheet vinculado. Esta vista solo lo recuerda.
async function renderAdmin(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="admin-wrap">
      <div class="admin-head">
        <div class="title-row"><img src="${LOGO}" alt="D&C"><h1>Registros de ingreso — Terminal Antofagasta</h1></div>
      </div>
      <div id="admin-body">
        <div class="empty">
          Los registros de este formulario ya no se guardan en esta página. Cada envío se registra automáticamente en la hoja de Google Sheets vinculada al Google Form.<br><br>
          Para verlos o exportarlos a Excel: abre tu Google Form → pestaña "Respuestas" → ícono de Google Sheets → en la hoja, usa Archivo → Descargar → Microsoft Excel (.xlsx).
          <br><br class="en">
          <span class="en">Entries are no longer stored on this page. Each submission is recorded automatically in the Google Sheet linked to the Google Form. To view or export to Excel: open your Google Form → "Responses" tab → Google Sheets icon → in the sheet, use File → Download → Microsoft Excel (.xlsx).</span>
        </div>
      </div>
    </div>
  `;
}

// ---------- ROUTER ----------
const params = new URLSearchParams(window.location.search);
if(params.get('admin') === '1'){
  renderAdmin();
} else {
  renderForm();
}
</script>
</body>
</html>
